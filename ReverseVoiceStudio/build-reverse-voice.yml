name: Build Reverse Voice APK

on:
  push:
    branches: [main]
    paths:
      - 'ReverseVoiceStudio/**'
      - '.github/workflows/build-reverse-voice.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Compile the installable APK
        working-directory: ReverseVoiceStudio
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify the Android signature
        working-directory: ReverseVoiceStudio
        run: $ANDROID_HOME/build-tools/35.0.0/apksigner verify --verbose app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Reverse-Voice-v1.0.1-APK
          path: ReverseVoiceStudio/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
